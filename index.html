<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Club — Country Audit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C16 3 6 14 6 20a10 10 0 0 0 20 0C26 14 16 3 16 3z' fill='%232b8a82'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea; --bg-2:#efeadf;
  --surface:#ffffff; --surface-2:#faf8f3; --surface-3:#f3efe6;
  --line:#e5ded0; --line-2:#d6ccb9;
  --ink:#12302e; --ink-2:#36524f; --muted:#6c7f7b; --faint:#9aa8a5;
  --coral:#e05a35; --coral-ink:#b5421f; --coral-soft:#fbe9e2;
  --gold:#c8902e; --gold-ink:#875f13; --gold-soft:#f8eed9;
  --aqua:#2b8a82; --aqua-ink:#1f6a63; --aqua-soft:#e2f1ee;
  --ok:#2f8a5b; --ok-soft:#e4f3ea; --ok-line:#a9d8bd;
  --no:#c4452a; --no-soft:#fcebe5; --no-line:#f0b9a8;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Arial,sans-serif;
  --shadow:0 1px 2px rgba(18,48,46,.05),0 6px 18px -10px rgba(18,48,46,.18);
  --mkt-new:var(--aqua); --mkt-dev:var(--gold);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.hidden{display:none!important}
b{font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--aqua);color:var(--aqua-ink)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{font-size:12px;padding:6px 10px;border-radius:7px}
.btn.danger:hover{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.lang{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:7px 11px;letter-spacing:.03em}
.lang button.on{background:var(--ink);color:#fff}

/* ---------- auth / country screens ---------- */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
  background:radial-gradient(1200px 500px at 50% -10%,#fff 0%,transparent 70%),var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%}
.login{max-width:400px;padding:34px 32px 30px;text-align:center}
.drop{width:30px;height:30px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#4aa8a0,var(--aqua-ink));transform:rotate(-45deg);display:inline-block;flex:none;box-shadow:0 6px 14px -6px rgba(43,138,130,.7)}
.login .drop{width:44px;height:44px;margin-bottom:18px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);font-weight:700}
.login h1,.cpick h1{font-family:var(--serif);font-weight:600;font-size:27px;letter-spacing:-.015em;line-height:1.1;margin:8px 0 8px}
.login p.sub{font-size:13.5px;color:var(--muted);margin-bottom:22px}
.field{display:block;text-align:left;margin-bottom:14px}
.field span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.input{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--ink);transition:.15s}
.input:focus{outline:none;border-color:var(--aqua);background:#fff;box-shadow:0 0 0 3px var(--aqua-soft)}
.login .btn.primary{width:100%;justify-content:center;padding:12px;font-size:14px}
.err{color:var(--no);font-size:13px;min-height:20px;margin-top:10px}
.login .langrow{display:flex;justify-content:center;margin-top:20px}

.cpick{max-width:620px;padding:32px 32px 28px}
.cpick .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.cpick .head .who{flex:1}
.cpick .head p{font-size:13.5px;color:var(--muted)}
.cpick form{display:flex;gap:10px;margin-bottom:8px}
.cpick form .input{flex:1}
.cpick .hint{font-size:12px;color:var(--muted);margin-bottom:24px}
.clist-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;transition:.15s}
.citem:hover{border-color:var(--aqua);background:#fff}
.citem .nm{font-family:var(--serif);font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .meta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.citem .mini{width:90px;height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:none}
.citem .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--coral))}
.citem .del{border:none;background:transparent;color:var(--faint);padding:4px;border-radius:6px;display:flex}
.citem .del:hover{color:var(--no);background:var(--no-soft)}
.citem .del svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}
.empty{font-size:13px;color:var(--muted);padding:16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center}
.cpick .foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}

/* ---------- app shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 26px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:12px;min-width:0}
.top .brand .drop{width:24px;height:24px}
.top h1{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.05;white-space:nowrap}
.top h1 span{color:var(--coral)}
.top .tag{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px;white-space:nowrap}
.cchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:6px 8px 6px 14px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;min-width:0}
.cchip:hover{border-color:var(--aqua)}
.cchip .cn{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cchip .sw{font-size:11px;color:var(--aqua-ink);background:var(--aqua-soft);padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.top .spacer{flex:1}
.saving{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saving i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.saving.busy i{background:var(--gold);animation:pulse 1s infinite}
.saving.fail{color:var(--no);cursor:pointer}
.saving.fail i{background:var(--no)}
@keyframes pulse{50%{opacity:.3}}
.userbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.userbox .av{width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

.page{flex:1;padding:22px 26px 30px;max-width:1500px;width:100%;margin:0 auto}

/* stage switcher */
.stagebar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
.stagebar .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.stagebar h2{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.stagebar p{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:80ch}
.overall{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.obar{width:150px;height:8px;background:var(--line);border-radius:8px;overflow:hidden;display:flex}
.obar .y{background:var(--ok)} .obar .n{background:var(--no)}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--surface-3);padding:5px;border-radius:12px}
.seg button{border:1px solid transparent;background:transparent;border-radius:9px;padding:9px 8px;text-align:left;color:var(--muted);transition:.15s;display:flex;flex-direction:column;gap:1px;min-width:0}
.seg button:hover{background:#fff;color:var(--ink)}
.seg button .n{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.seg button .r{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink-2);line-height:1.1}
.seg button .s{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.past{color:var(--aqua-ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#cfe3e0;box-shadow:0 6px 14px -8px rgba(18,48,46,.6)}
.seg button.on .r{color:#fff}
.seg button.on .n{color:var(--coral-soft);color:#f2a488}

/* market band */
.mkt-band{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:4px 0 8px}
.mkt-seg{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:5px 2px;position:relative;white-space:nowrap}
.mkt-seg .sw{width:9px;height:9px;border-radius:50%;flex:none}
.mkt-seg.new{color:var(--aqua-ink)} .mkt-seg.new .sw{background:var(--mkt-new)}
.mkt-seg.dev{color:var(--gold-ink)} .mkt-seg.dev .sw{background:var(--mkt-dev)}
.mkt-seg .bracket{position:absolute;left:0;right:0;bottom:-3px;height:2px;background:currentColor;opacity:.25;border-radius:2px}

/* track */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.st{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px 15px 13px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);min-height:380px}
.st:hover{transform:translateY(-3px);border-color:var(--aqua)}
.st.current{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.st.ahead{background:var(--surface-2);border-style:dashed;box-shadow:none}
.st.ahead>*:not(.ahead-tag){opacity:.55}
.st .pill{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.st .rev{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1;margin:6px 0 2px}
.st .revsub{font-size:10.5px;color:var(--muted)}
.st .cons{display:flex;align-items:baseline;gap:6px;margin:8px 0 2px;padding:5px 9px;background:var(--aqua-soft);border-radius:7px}
.st .cons b{font-family:var(--serif);font-size:15px;color:var(--aqua-ink);line-height:1}
.st .cons span{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--aqua-ink);opacity:.8;line-height:1.1}
.st h3{font-family:var(--serif);font-size:15px;color:var(--coral-ink);margin:11px 0 8px;font-weight:600;line-height:1.15}
.st .top3{list-style:none;flex:1}
.st .top3 li{position:relative;padding-left:14px;margin:0 0 7px;font-size:11.5px;color:var(--ink-2);line-height:1.35}
.st .top3 li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--aqua)}
.st.founders .top3 li::before{background:var(--gold)}
.st .goldline{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:0}
.st.founders .goldline{opacity:1}
.st .num{position:absolute;top:13px;right:15px;font-family:var(--serif);font-size:12px;color:var(--faint)}
.st .tally{display:flex;gap:6px;margin-top:10px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.st .tally span{padding:3px 8px;border-radius:6px}
.t-yes{background:var(--ok-soft);color:var(--ok)}
.t-no{background:var(--no-soft);color:var(--no)}
.t-open{background:var(--surface-3);color:var(--muted)}
.st .pbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;display:flex}
.st .pbar .y{background:var(--ok)} .st .pbar .n{background:var(--no)}
.cur-tag,.ahead-tag{position:absolute;top:11px;right:12px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.cur-tag{background:var(--ink);color:#fff}
.ahead-tag{background:var(--surface-3);color:var(--muted);border:1px solid var(--line)}
.st.current .num,.st.ahead .num{display:none}
.map-foot{margin-top:14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.map-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);flex:none}
.map-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- phase ---------- */
.ph{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ph-top{display:flex;align-items:center;gap:18px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.ph-top .rev{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1}
.ph-top .rev small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.ph-top .ttl{flex:1;min-width:200px}
.ph-top .ttl h2{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.1;margin-top:3px}
.mkt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:20px}
.mkt.new{background:var(--aqua-soft);color:var(--aqua-ink)}
.mkt.dev{background:var(--gold-soft);color:var(--gold-ink)}
.ph-body{display:grid;grid-template-columns:1.4fr .85fr}
.ph-lists{padding:20px 26px;border-right:1px solid var(--line)}
.ph-side{padding:20px 24px;background:var(--surface-2)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px;stroke:currentColor;stroke-width:2;fill:none}
.banner.ahead{background:var(--surface-3);color:var(--ink-2);border:1px dashed var(--line-2)}
.banner.ro{background:var(--gold-soft);color:var(--gold-ink)}
.headline{background:var(--gold-soft);border:1px solid #efdcb4;border-radius:12px;padding:15px 18px;margin-bottom:22px}
.headline .hl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;margin-bottom:10px}
.headline ol{list-style:none;counter-reset:h}
.headline li{counter-increment:h;position:relative;padding-left:34px;margin:0 0 10px;font-size:14px;color:var(--ink);line-height:1.35}
.headline li:last-child{margin-bottom:0}
.headline li::before{content:counter(h);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;background:var(--gold);color:#fff;font-family:var(--serif);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tracklabel{display:flex;align-items:center;gap:9px;margin:2px 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.tracklabel.rev{color:var(--coral-ink)} .tracklabel.ldr{color:var(--gold-ink)}
.tracklabel .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.tracklabel.rev .ic{background:var(--coral-soft)} .tracklabel.ldr .ic{background:var(--gold-soft)}
.tracklabel .ic svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none}
.tracklabel .cnt{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.chk{list-style:none;margin:0 0 24px;display:flex;flex-direction:column;gap:7px}
.chk li{border:1px solid var(--line);border-radius:11px;background:#fff;transition:.15s}
.chk li.yes{background:var(--ok-soft);border-color:var(--ok-line)}
.chk li.no{background:var(--no-soft);border-color:var(--no-line)}
.chk .rowi{display:flex;gap:12px;align-items:flex-start;padding:10px 12px}
.chk .txt{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.45;padding-top:3px}
.chk .txt b{color:var(--ink)}
.yn{display:flex;gap:4px;flex:none}
.yn button{border:1px solid var(--line-2);background:#fff;color:var(--muted);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;display:flex;align-items:center;gap:5px;transition:.12s}
.yn button svg{width:12px;height:12px;stroke:currentColor;stroke-width:3;fill:none}
.yn button.y:hover{border-color:var(--ok);color:var(--ok)}
.yn button.n:hover{border-color:var(--no);color:var(--no)}
.yn button.y.on{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.n.on{background:var(--no);border-color:var(--no);color:#fff}
.yn button.c{padding:6px 8px}
.yn button.c.has{color:var(--aqua-ink);border-color:var(--aqua)}
.yn button:disabled{cursor:default;opacity:.6}
.cmt{padding:0 12px 11px 12px}
.cmt textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;background:#fff;padding:8px 10px;font-size:13px;color:var(--ink);resize:vertical;min-height:54px;line-height:1.45}
.cmt textarea:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-soft)}
.chk li.no .cmt textarea{border-color:var(--no-line)}
.cmt .need{font-size:11.5px;color:var(--no);margin-top:4px;font-weight:600}
.cmt .ro{font-size:13px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.ph-nav{display:flex;justify-content:space-between;gap:10px;padding-top:6px}

.side-h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-ink);font-weight:700;margin:0 0 8px}
.side-p{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;background:#fff;border:1px solid var(--line)}
.chip.co{color:var(--coral-ink);border-color:#f3c7b7} .chip.gd{color:var(--gold-ink);border-color:#ebd3a2} .chip.aq{color:var(--aqua-ink);border-color:#b5dbd5}
.callout{border-left:3px solid var(--aqua);background:#fff;padding:11px 14px;border-radius:0 9px 9px 0;font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:14px}
.callout.gd{border-color:var(--gold)} .callout.co{border-color:var(--coral)}
.side-metric{display:flex;gap:12px;margin-bottom:16px}
.side-metric div{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.side-metric b{font-family:var(--serif);font-size:20px;color:var(--aqua-ink);display:block;line-height:1}
.side-metric.co b{color:var(--coral-ink)} .side-metric.gd b{color:var(--gold-ink)}
.side-metric span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
.gate{margin-top:6px;padding:12px 14px;border-radius:10px;background:var(--ink);color:#cfe3e0}
.gate .gl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#e7b964;font-weight:700}
.gate p{font-size:12.5px;margin-top:5px;line-height:1.45}
.gate p b{color:#fff}
.define{margin-top:14px;background:var(--gold-soft);border:1px dashed #dcbf84;border-radius:10px;padding:12px 14px}
.define label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;display:block;margin-bottom:6px}
.define textarea{width:100%;background:#fff;border:1px solid #e3cfa4;border-radius:8px;color:var(--ink);font-size:12.5px;padding:9px 11px;resize:vertical;min-height:56px;line-height:1.45}
.define textarea:focus{outline:none;border-color:var(--gold)}
.define .hint{font-size:11px;color:var(--gold-ink);margin-top:6px;opacity:.85}
.ph-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;font-weight:600}
.ph-summary span{padding:5px 10px;border-radius:7px}

/* ---------- gaps / admin ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px}
.panel-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.panel-h h2{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.panel-h p{font-size:13px;color:var(--muted);margin-top:3px}
.gap-stage{margin-bottom:18px}
.gap-stage h3{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.gap-stage h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500}
.gap{border:1px solid var(--no-line);background:var(--no-soft);border-radius:10px;padding:10px 13px;margin-bottom:6px}
.gap .gt{font-size:13.5px;color:var(--ink)}
.gap .gs{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.gap .gc{font-size:13px;color:var(--ink-2);margin-top:6px;padding-top:6px;border-top:1px dashed var(--no-line);white-space:pre-wrap}
.gap .gc.miss{color:var(--no);font-weight:600}
.okmsg{padding:18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:600;text-align:center}

.tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:10px;width:max-content;margin-bottom:16px}
.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.tbl .country{font-family:var(--serif);font-weight:600;font-size:15px}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.tblwrap{overflow-x:auto}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink)}
.uform{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:10px;align-items:end;margin-bottom:18px;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.uform .field{margin:0}
.uform .chkl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);padding-bottom:12px;white-space:nowrap}
.pwrow{display:flex;gap:6px}
.pwrow .input{flex:1}
.notice{padding:12px 14px;border-radius:10px;background:var(--aqua-soft);color:var(--aqua-ink);font-size:13px;margin-bottom:14px}
.notice code{font-size:14px;font-weight:700;background:#fff;padding:2px 7px;border-radius:5px;color:var(--ink)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 14px 40px -14px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-size:14px}

@media (max-width:1180px){
  .track,.mkt-band{grid-template-columns:repeat(3,1fr)}
  .mkt-band{display:none}
  .st{min-height:0}
}
@media (max-width:900px){
  .seg{grid-template-columns:repeat(3,1fr)}
  .ph-body{grid-template-columns:1fr}
  .ph-lists{border-right:none;border-bottom:1px solid var(--line)}
  .top{flex-wrap:wrap;padding:10px 16px}
  .top .brand .txtb{display:none}
  .page{padding:16px}
  .uform{grid-template-columns:1fr}
}
@media (max-width:620px){
  .track{grid-template-columns:1fr}
  .seg{grid-template-columns:repeat(2,1fr)}
  .chk .rowi{flex-direction:column}
  .userbox .nm{display:none}
  .cpick,.login{padding:24px 18px}
  .cpick form{flex-direction:column}
}
</style>
</head>
<body>
<div id="root"><div class="loading">…</div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
